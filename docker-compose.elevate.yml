services:
  elevate-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: api__elevate
    environment:
      OPEN_WEARABLES_BASE_URL: http://app:8000
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ELEVATE_API_PORT:-8100}:8000"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/app
          target: /app/app
        - action: rebuild
          path: ./apps/api/pyproject.toml
        - action: rebuild
          path: ./apps/api/uv.lock
    restart: on-failure
